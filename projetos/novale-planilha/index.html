function line(m,a,b){const W=560,H=240,p=34,mx=Math.max(...a,...b)*1.08,X=i=>p+i*(W-p-10)/(m.length-1),Y=v=>H-24-(v/mx)*(H-44),P=s=>s.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('');
let g='';for(let i=0;i<=4;i++){const y=Y(mx*i/5);g+='<line x1="'+p+'" x2="'+(W-10)+'" y1="'+y+'" y2="'+y+'" stroke="#24402f"/><text x="2" y="'+(y+4)+'" fill="#93aa9d" font-size="10">'+Math.round(mx*i/5/1000)+'k</text>'}
return'<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Receita e despesas por mês">'+g+m.map((t,i)=>'<text x="'+X(i)+'" y="'+(H-6)+'" fill="#93aa9d" font-size="10" text-anchor="middle">'+t+'</text>').join('')+'<path d="'+P(a)+'" fill="none" stroke="#3fb37f" stroke-width="3" stroke-linecap="round"/><path d="'+P(b)+'" fill="none" stroke="#d8b56a" stroke-width="3" stroke-linecap="round"/></svg><div class="lg"><span><i style="background:#3fb37f"></i>Receita</span><span><i style="background:#d8b56a"></i>Despesas</span></div>'}
function donut(c){const t=c.reduce((s,x)=>s+x[1],0),cl=['#3fb37f','#d8b56a','#6fa8c9','#a58ad0'];let o=0;const r=42,C=2*Math.PI*r;
