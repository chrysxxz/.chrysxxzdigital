<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root{--primary:#0b8068;--dark:#07634f;--soft:#e5f5f0;--page:#f3f6f7;--surface:#fff;--ink:#17252a;--muted:#68777b;--line:#dbe4e5;--shadow:0 14px 35px rgba(20,49,54,.08)}

        *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Arial,sans-serif}body{background:var(--page);color:var(--ink);min-height:100vh;transition:.2s}button,input,textarea{font:inherit}button{cursor:pointer;border:0}
        .app-header{height:88px;padding:18px 32px;color:#fff;background:linear-gradient(120deg,var(--dark),var(--primary));display:flex;align-items:center;justify-content:space-between}.brand h1{font-size:23px}.brand p{margin-top:4px;opacity:.8;font-size:13px}.header-badge{border:1px solid #ffffff47;border-radius:20px;padding:9px 14px;font-size:12px}.layout{display:flex;min-height:calc(100vh - 88px)}.sidebar{width:246px;padding:26px 16px;background:var(--surface);border-right:1px solid var(--line)}.sidebar-label{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:1px;font-weight:700;padding:0 14px 12px}.menu{width:100%;text-align:left;padding:13px 14px;border-radius:8px;margin-bottom:4px;background:transparent;color:var(--muted);font-weight:600;transition:.15s}.menu:hover,.menu.active{color:var(--primary);background:var(--soft)}.menu-icon{width:22px;display:inline-block;margin-right:8px;text-align:center}.content{flex:1;padding:32px;max-width:1320px}.view-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:25px}.eyebrow{color:var(--primary);font-size:11px;text-transform:uppercase;letter-spacing:1.2px;font-weight:800;margin-bottom:7px}.view-heading h2{font-size:28px;letter-spacing:-.6px}.view-heading p{color:var(--muted);margin-top:6px}.button{border-radius:7px;padding:12px 17px;font-weight:700;display:inline-flex;gap:8px;align-items:center;justify-content:center}.button.primary{color:#fff;background:var(--primary);box-shadow:0 5px 12px #0002}.button.primary:hover{background:var(--dark)}.button.secondary{color:var(--ink);border:1px solid var(--line);background:var(--surface)}.button.danger{color:#c24141;background:#fff1f1}.button.icon{padding:9px 12px;font-size:19px}.panel,.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}.panel{padding:24px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}.card{padding:22px}.card h3{margin:12px 0 7px}.card p,.muted{color:var(--muted);line-height:1.55}.stat{color:var(--primary);font-size:27px;font-weight:800}.home-banner{padding:32px;background:linear-gradient(120deg,var(--soft),var(--surface))}.toolbar{display:flex;gap:12px;margin-bottom:16px}.search{position:relative;flex:1}.search span{position:absolute;left:14px;top:11px;color:var(--muted)}.search input{width:100%;padding-left:40px}.input,.textarea,select{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:11px 12px;outline:0}.input:focus,.textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--soft)}.contact-list{display:grid;gap:10px}.contact{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:17px 19px;cursor:pointer;transition:.15s}.contact:hover{transform:translateY(-2px);border-color:var(--primary)}.contact h3{font-size:16px}.contact p{color:var(--muted);font-size:13px;margin-top:5px}.contact-phone{color:var(--primary);font-weight:800;white-space:nowrap}.empty{text-align:center;padding:52px 20px;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:7px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:17px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}.field label span{color:var(--muted);font-weight:400}.textarea{min-height:92px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.settings-section{margin-bottom:22px}.settings-section h3{margin-bottom:7px}.settings-section>p{color:var(--muted);margin-bottom:17px;font-size:14px}.choice-row{display:flex;gap:10px;flex-wrap:wrap}.choice{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:12px 16px}.choice.selected{color:var(--primary);border:2px solid var(--primary);padding:11px 15px;background:var(--soft);font-weight:700}.color-dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:7px}.modal-backdrop{position:fixed;inset:0;background:#0f1e2085;display:grid;place-items:center;padding:20px;z-index:5}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--surface);border-radius:12px;padding:25px;box-shadow:0 24px 70px #0004}.modal-heading{display:flex;justify-content:space-between;margin-bottom:22px}.close{color:var(--muted);background:transparent;font-size:25px}.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:var(--surface);padding:13px 17px;border-radius:7px;box-shadow:var(--shadow);z-index:8}
        .profile-switcher{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--soft);color:var(--primary);display:grid;place-items:center;font-weight:800}.profile-select{border:1px solid #ffffff55;border-radius:7px;background:#ffffff18;color:#fff;padding:9px 12px}.profile-select option{color:#17252a}.profile-card{display:flex;align-items:center;gap:14px;margin-bottom:22px}.profile-card .avatar{width:48px;height:48px}.profile-card h3{font-size:15px}.profile-card p{color:var(--muted);font-size:12px;margin-top:3px}.profile-form{display:grid;grid-template-columns:140px 1fr;gap:22px;align-items:start}.avatar-large{width:120px;height:120px;border-radius:14px;object-fit:cover;background:var(--soft);display:grid;place-items:center;color:var(--primary);font-size:36px;font-weight:800}.catalog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.product{overflow:hidden}.product-image{width:100%;height:150px;object-fit:cover;background:var(--soft);display:grid;place-items:center;color:var(--primary);font-size:28px}.product-body{padding:16px}.product-body h3{margin-bottom:5px}.product-body p{color:var(--muted);font-size:13px;min-height:38px}.product-footer{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.price{color:var(--primary);font-weight:800}.mark{display:inline-block;width:8px;height:8px;background:var(--primary);border-radius:50%;margin-right:7px}.metric{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.metric:last-child{border-bottom:0}.metric strong{font-size:22px;color:var(--primary)}.schedule-list{border:1px solid var(--line);border-radius:8px;overflow:hidden}.schedule-row{display:grid;grid-template-columns:170px 1fr 1fr;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}.schedule-row:last-child{border-bottom:0}.schedule-day{font-weight:700;font-size:13px}.schedule-period{display:flex;align-items:center;gap:7px}.schedule-period span{color:var(--muted);font-size:12px}.schedule-period .input{min-width:0;padding:8px}
        @media(max-width:720px){.app-header{padding:16px 18px;height:auto}.header-badge{display:none}.profile-switcher{width:100%}.profile-select{flex:1}.layout{display:block}.sidebar{width:100%;padding:10px;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.sidebar-label{display:none}.menu{white-space:nowrap;width:auto}.content{padding:22px 16px}.view-heading{display:block}.view-heading .button{margin-top:16px}.cards,.form-grid,.catalog-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar{display:block}.toolbar .button{width:100%;margin-top:10px}.panel{padding:17px}.contact{align-items:flex-start}.contact-phone{white-space:normal;text-align:right}.form-actions{flex-direction:column-reverse}.form-actions .button{width:100%}.profile-form{grid-template-columns:1fr}.avatar-large{margin:auto}.schedule-row{grid-template-columns:1fr}.schedule-period{max-width:100%}}
    </style>
</head>
<body>
    <header class="app-header"><div class="brand"><h1>Central de Retenção</h1><p>Sistema interno de atendimento e acompanhamento</p></div><div class="profile-switcher"><div class="avatar" id="header-avatar">C</div><select class="profile-select" id="profile-select" aria-label="Conta ativa"><option value="personal">Conta Pessoal</option><option value="business">Conta Business</option></select></div></header>
    <div class="layout"><aside class="sidebar"><div class="sidebar-label">Navegação</div><button class="menu active" data-page="inicio"><span class="menu-icon">⌂</span>Início</button><button class="menu" data-page="clientes"><span class="menu-icon">♙</span>Clientes</button><button class="menu" data-page="conversas"><span class="menu-icon">◌</span>Conversas</button><button class="menu" data-page="relatorios"><span class="menu-icon">▥</span>Relatórios</button><button class="menu" data-page="configuracoes"><span class="menu-icon">⚙</span>Configurações</button></aside><main class="content" id="app"></main></div><div id="modal-root"></div><div id="toast-root"></div>
    <script>
        const colors={verde:'#0b8068',azul:'#2563a8',roxo:'#7546a8',laranja:'#c96b1d',vermelho:'#c24141',cinza:'#59666a'};const defaults={contacts:[],appearance:{theme:'auto',color:'verde'}};let state=JSON.parse(localStorage.getItem('central-retencao'))||defaults,activePage='inicio',searchTerm='';const app=document.getElementById('app');const save=()=>localStorage.setItem('central-retencao',JSON.stringify(state));const esc=value=>String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const hasNotes=c=>['name','address','contact','reason','reference','notes'].some(k=>c[k]);
        function applyAppearance(){document.documentElement.style.setProperty('--primary',colors[state.appearance.color]||colors.verde);document.documentElement.style.setProperty('--dark',colors[state.appearance.color]||colors.verde);const dark=state.appearance.theme==='dark'||(state.appearance.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light'}function layout(title,subtitle,action=''){return`<div class="view-heading"><div><div class="eyebrow">Central de Retenção</div><h2>${title}</h2><p>${subtitle}</p></div>${action}</div>`}
        function renderHome(){app.innerHTML=layout('Visão geral','Acompanhe os principais pontos da operação.')+`<div class="panel home-banner"><div class="eyebrow">Hoje</div><h2>Bem-vindo à Central de Retenção</h2><p class="muted">Tenha uma visão rápida dos contatos e acompanhe cada oportunidade de retenção.</p></div><div class="cards"><div class="card"><div class="stat">${state.contacts.length}</div><h3>Contatos salvos</h3><p>Telefones com anotações rápidas para consulta da equipe.</p></div><div class="card"><div class="stat">${state.contacts.filter(hasNotes).length}</div><h3>Com informações</h3><p>Contatos que já possuem detalhes registrados.</p></div><div class="card"><div class="stat">${state.contacts.length?'Ativa':'Pronta'}</div><h3>Central de contatos</h3><p>Pesquise, abra e atualize qualquer anotação.</p></div></div>`}
        function renderClients(){const filtered=state.contacts.filter(c=>JSON.stringify(c).toLowerCase().includes(searchTerm.toLowerCase()));const list=filtered.length?filtered.map(c=>{const details=[['Nome',c.name],['Endereço',c.address],['Contato',c.contact],['Motivo',c.reason],['Referência',c.reference],['Anotação',c.notes]].filter(([,value])=>value).map(([label,value])=>`${label}: ${esc(value)}`).join(' · ');return`<article class="panel contact" data-open="${c.id}"><div><h3>${esc(c.name)||'Contato sem nome'}</h3><p>${details||'Sem anotação adicional'}</p></div><div class="contact-phone">${esc(c.phone)}</div></article>`}).join(''):`<div class="panel empty"><strong>${searchTerm?'Nenhum contato encontrado':'Sua lista ainda está vazia'}</strong><span>${searchTerm?'Tente pesquisar por outro termo.':'Adicione um telefone para começar a registrar informações.'}</span></div>`;app.innerHTML=layout('Clientes','Contatos organizados por telefone, com anotações rápidas.','<button class="button primary" id="add-contact">＋ Adicionar contato</button>')+`<div class="toolbar"><div class="search"><span>⌕</span><input class="input" id="client-search" placeholder="Pesquisar telefone, nome ou anotações" value="${esc(searchTerm)}"></div></div><div class="contact-list">${list}</div>`;document.getElementById('add-contact').onclick=()=>openContactModal();const input=document.getElementById('client-search');input.oninput=e=>{searchTerm=e.target.value;renderClients();document.getElementById('client-search').focus()};document.querySelectorAll('[data-open]').forEach(item=>item.onclick=()=>openContactModal(item.dataset.open))}
        function renderPlaceholder(title){app.innerHTML=layout(title,'Organize o trabalho da equipe em um só lugar.')+`<div class="panel empty"><strong>${title} em acompanhamento</strong><span>Este espaço continua disponível para o fluxo da equipe.</span></div>`}
        function renderSettings(){const themes=[['light','Tema claro'],['dark','Tema escuro'],['auto','Automático']],palette=[['verde','Verde'],['azul','Azul'],['roxo','Roxo'],['laranja','Laranja'],['vermelho','Vermelho'],['cinza','Cinza']];app.innerHTML=layout('Configurações','Ajuste a experiência da Central para o seu ambiente.')+`<div class="panel"><section class="settings-section"><h3>Aparência</h3><p>Escolha como a Central deve aparecer neste navegador.</p><div class="choice-row">${themes.map(([id,label])=>`<button class="choice ${state.appearance.theme===id?'selected':''}" data-theme-choice="${id}">${label}</button>`).join('')}</div></section><section class="settings-section"><h3>Cor principal</h3><p>A cor escolhida se aplica ao menu, botões, cartões, cabeçalho e destaques.</p><div class="choice-row">${palette.map(([id,label])=>`<button class="choice ${state.appearance.color===id?'selected':''}" data-color-choice="${id}"><i class="color-dot" style="background:${colors[id]}"></i>${label}</button>`).join('')}</div></section></div>`;document.querySelectorAll('[data-theme-choice]').forEach(b=>b.onclick=()=>{state.appearance.theme=b.dataset.themeChoice;save();applyAppearance();renderSettings();showToast('Tema atualizado')});document.querySelectorAll('[data-color-choice]').forEach(b=>b.onclick=()=>{state.appearance.color=b.dataset.colorChoice;save();applyAppearance();renderSettings();showToast('Cor principal atualizada')})}
        function render(){document.querySelectorAll('.menu').forEach(i=>i.classList.toggle('active',i.dataset.page===activePage));if(activePage==='inicio')renderHome();else if(activePage==='clientes')renderClients();else if(activePage==='configuracoes')renderSettings();else renderPlaceholder(activePage[0].toUpperCase()+activePage.slice(1))}
        function contactForm(c={}){return`<form id="contact-form"><div class="form-grid"><div class="field full"><label for="phone">Telefone</label><input class="input" id="phone" name="phone" required value="${esc(c.phone)}" placeholder="(00) 00000-0000"></div><div class="field"><label for="name">Nome <span>opcional</span></label><input class="input" id="name" name="name" value="${esc(c.name)}"></div><div class="field"><label for="address">Endereço <span>opcional</span></label><input class="input" id="address" name="address" value="${esc(c.address)}"></div><div class="field"><label for="contact">Contato <span>opcional</span></label><input class="input" id="contact" name="contact" value="${esc(c.contact)}"></div><div class="field"><label for="reason">Motivo de contato <span>opcional</span></label><input class="input" id="reason" name="reason" value="${esc(c.reason)}"></div><div class="field"><label for="reference">Referência <span>opcional</span></label><input class="input" id="reference" name="reference" value="${esc(c.reference)}"></div><div class="field full"><label for="notes">Outras anotações <span>opcional</span></label><textarea class="textarea" id="notes" name="notes" placeholder="Registre uma informação rápida">${esc(c.notes)}</textarea></div></div><div class="form-actions"><button type="button" class="button secondary" id="cancel-modal">Cancelar</button><button type="submit" class="button primary">Salvar contato</button></div></form>`}
        function openContactModal(id){const c=state.contacts.find(x=>x.id===id);document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-heading"><div><div class="eyebrow">${c?'Detalhes do contato':'Novo contato'}</div><h2>${c?'Editar anotações':'Adicionar contato'}</h2></div><button class="close" id="close-modal" aria-label="Fechar">×</button></div>${contactForm(c)}${c?'<div class="form-actions"><button class="button danger" id="delete-contact">Excluir contato</button></div>':''}</div></div>`;const close=()=>document.getElementById('modal-root').innerHTML='';document.getElementById('close-modal').onclick=close;document.getElementById('cancel-modal').onclick=close;document.getElementById('contact-form').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(c)Object.assign(c,data);else state.contacts.unshift({...data,id:crypto.randomUUID()});save();close();renderClients();showToast(c?'Contato atualizado':'Contato salvo')};if(c)document.getElementById('delete-contact').onclick=()=>{if(confirm('Excluir este contato e todas as suas anotações?')){state.contacts=state.contacts.filter(x=>x.id!==c.id);save();close();renderClients();showToast('Contato excluído')}};document.getElementById('phone').focus()}
        function showToast(message){document.getElementById('toast-root').innerHTML=`<div class="toast">${message}</div>`;setTimeout(()=>document.getElementById('toast-root').innerHTML='',2200)}document.querySelectorAll('.menu').forEach(i=>i.onclick=()=>{activePage=i.dataset.page;searchTerm='';render()});matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.appearance.theme==='auto')applyAppearance()});applyAppearance();render();
    </script>
    <script>
        (() => {
            const profileDefaults = { personal: { name: 'Meu perfil', photo: '', info: '', address: '', type: '', description: '' }, business: { name: 'Minha empresa', photo: '', info: '', address: '', type: '', description: '', schedule: {} } };
            state.profiles = state.profiles || JSON.parse(JSON.stringify(profileDefaults));
            state.profiles.personal = { ...profileDefaults.personal, ...state.profiles.personal };
            state.profiles.business = { ...profileDefaults.business, ...state.profiles.business, catalog: state.profiles.business?.catalog || [], schedule: state.profiles.business?.schedule || {} };
            const weekDays = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
            weekDays.forEach((day, index) => { state.profiles.business.schedule[index] = { open: false, firstOpen: '08:00', firstClose: '12:00', secondOpen: '13:00', secondClose: '18:00', ...state.profiles.business.schedule[index] }; });
            state.activeProfile = state.activeProfile || 'personal';
            state.contacts = (state.contacts || []).map(contact => ({ createdAt: contact.createdAt || Date.now(), ...contact }));
            save();
            const activeProfile = () => state.profiles[state.activeProfile];
            const initials = name => (name || 'C').trim().split(/\s+/).slice(0, 2).map(word => word[0]).join('').toUpperCase();
            const avatar = profile => profile.photo ? `<img class="avatar" src="${profile.photo}" alt="">` : `<div class="avatar">${esc(initials(profile.name))}</div>`;
            const profilePhoto = profile => profile.photo ? `<img class="avatar-large" src="${profile.photo}" alt="">` : `<div class="avatar-large">${esc(initials(profile.name))}</div>`;
            const infoCount = contact => ['name', 'address', 'contact', 'reason', 'reference', 'notes'].filter(key => contact[key]).length;
            const allDetails = contact => [['Nome', contact.name], ['Endereço', contact.address], ['Contato', contact.contact], ['Motivo', contact.reason], ['Referência', contact.reference], ['Anotação', contact.notes]].filter(([, value]) => value).map(([label, value]) => `${label}: ${esc(value)}`).join(' · ');
            const fileToDataUrl = file => new Promise(resolve => { if (!file) return resolve(''); const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.readAsDataURL(file); });
            const profileHeader = () => { const profile = activeProfile(); document.getElementById('header-avatar').outerHTML = avatar(profile).replace('class="avatar"', 'class="avatar" id="header-avatar"'); document.getElementById('profile-select').value = state.activeProfile; };
            function renderModernClients() { const filtered = state.contacts.filter(contact => JSON.stringify(contact).toLowerCase().includes(searchTerm.toLowerCase())); const list = filtered.length ? filtered.map(contact => `<article class="panel contact" data-open="${contact.id}"><div><h3>${esc(contact.name) || 'Contato sem nome'} ${infoCount(contact) ? '<span class="mark" title="Possui anotações"></span>' : ''}</h3><p>${allDetails(contact) || 'Sem anotação adicional'}</p></div><div class="contact-phone">${esc(contact.phone)}</div></article>`).join('') : `<div class="panel empty"><strong>${searchTerm ? 'Nenhum contato encontrado' : 'Sua lista ainda está vazia'}</strong><span>${searchTerm ? 'Tente pesquisar por outro termo.' : 'Adicione um telefone para começar a registrar informações.'}</span></div>`; app.innerHTML = layout('Clientes', 'Contatos organizados por telefone, com anotações rápidas.', '<button class="button primary" id="add-contact">＋ Adicionar contato</button>') + `<div class="toolbar"><div class="search"><span>⌕</span><input class="input" id="client-search" placeholder="Pesquisar telefone, nome ou anotações" value="${esc(searchTerm)}"></div></div><div class="contact-list">${list}</div>`; document.getElementById('add-contact').onclick = () => openModernContact(); const input = document.getElementById('client-search'); input.oninput = event => { searchTerm = event.target.value; renderModernClients(); document.getElementById('client-search').focus(); }; document.querySelectorAll('[data-open]').forEach(item => item.onclick = () => openModernContact(item.dataset.open)); }
            function openModernContact(id) { const contact = state.contacts.find(item => item.id === id) || {}; openContactModal(id); if (!id) return; }
            function scheduleStatus() { const now = new Date(), day = now.getDay(), minutes = now.getHours() * 60 + now.getMinutes(); const schedule = state.profiles.business.schedule; for (let offset = 0; offset < 7; offset++) { const index = (day + offset) % 7, item = schedule[index]; if (!item.open) continue; const periods = [[item.firstOpen, item.firstClose], [item.secondOpen, item.secondClose]].filter(([start, end]) => start && end); for (const [start, end] of periods) { const startMinutes = Number(start.slice(0, 2)) * 60 + Number(start.slice(3)), endMinutes = Number(end.slice(0, 2)) * 60 + Number(end.slice(3)); if (offset === 0 && minutes >= startMinutes && minutes < endMinutes) return { open: true, text: 'Aberto agora' }; if (offset > 0 || (offset === 0 && minutes < startMinutes)) return { open: false, text: `Fechado · abre ${offset === 0 ? 'hoje' : offset === 1 ? 'amanhã' : weekDays[index]} às ${start}` }; } } return { open: false, text: 'Fechado · nenhum horário configurado' }; }
            function renderModernHome() { const total = state.contacts.length, filled = state.contacts.filter(infoCount).length, recent = state.contacts.filter(contact => Date.now() - contact.createdAt < 7 * 86400000).length, businessStatus = state.activeProfile === 'business' ? scheduleStatus() : null; app.innerHTML = layout('Visão geral', `Conta ${state.activeProfile === 'business' ? 'Business' : 'Pessoal'} · dados locais da plataforma`) + `<div class="panel home-banner"><div class="profile-card">${avatar(activeProfile())}<div><h3>${esc(activeProfile().name)}</h3><p>${state.activeProfile === 'business' ? 'Perfil empresarial' : 'Perfil pessoal'}${businessStatus ? ` · <strong style="color:var(--primary)">${businessStatus.text}</strong>` : ''}</p></div></div><h2>Bem-vindo à Central de Retenção</h2><p class="muted">Uma visão rápida dos contatos e das oportunidades da sua operação.</p></div><div class="cards"><div class="card"><div class="stat">${total}</div><h3>Contatos salvos</h3><p>Telefones registrados na plataforma.</p></div><div class="card"><div class="stat">${filled}</div><h3>Com informações</h3><p>Contatos com anotações preenchidas.</p></div><div class="card"><div class="stat">${recent}</div><h3>Adicionados em 7 dias</h3><p>Novos contatos recentes.</p></div></div>`; }
            function renderReports() { const total = state.contacts.length, filled = state.contacts.filter(infoCount).length, recent = state.contacts.filter(contact => Date.now() - contact.createdAt < 7 * 86400000).length; app.innerHTML = layout('Relatórios', 'Indicadores atualizados a partir dos contatos locais.') + `<div class="panel"><div class="metric"><span>Total de contatos</span><strong>${total}</strong></div><div class="metric"><span>Contatos com informações</span><strong>${filled}</strong></div><div class="metric"><span>Contatos sem informações</span><strong>${total - filled}</strong></div><div class="metric"><span>Adicionados nos últimos 7 dias</span><strong>${recent}</strong></div></div>`; }
            function profileForm(kind) { const profile = state.profiles[kind]; const business = kind === 'business'; return `<section class="settings-section"><div class="profile-form"><div>${profilePhoto(profile)}<input type="file" id="${kind}-photo" accept="image/*" class="input" style="margin-top:10px"></div><div class="form-grid"><div class="field full"><label for="${kind}-name">${business ? 'Nome da empresa' : 'Nome'}</label><input class="input" id="${kind}-name" value="${esc(profile.name)}"></div>${business ? '<div class="field"><label for="business-address">Endereço do estabelecimento</label><input class="input" id="business-address" value="' + esc(profile.address) + '"></div><div class="field"><label for="business-type">Tipo de loja/empresa</label><input class="input" id="business-type" value="' + esc(profile.type) + '"></div><div class="field full"><label for="business-description">Descrição</label><textarea class="textarea" id="business-description">' + esc(profile.description) + '</textarea></div><div class="field full"><label for="business-info">Informações comerciais</label><textarea class="textarea" id="business-info">' + esc(profile.info) + '</textarea></div>' : '<div class="field full"><label for="personal-info">Informações pessoais <span>opcional</span></label><textarea class="textarea" id="personal-info">' + esc(profile.info) + '</textarea></div>'}</div></div><div class="form-actions"><button class="button primary" data-save-profile="${kind}">Salvar perfil ${business ? 'Business' : 'Pessoal'}</button></div></section>`; }
            function scheduleMarkup() { const schedule = state.profiles.business.schedule; return `<section class="settings-section" style="margin-top:25px"><h3>Horário de atendimento</h3><p>Configure até dois períodos por dia. O status usa o horário do computador.</p><div class="schedule-list">${weekDays.map((day, index) => { const item = schedule[index]; return `<div class="schedule-row" data-day="${index}"><label class="schedule-day"><input type="checkbox" data-schedule-open ${item.open ? 'checked' : ''}> ${day}</label><div class="schedule-period"><input class="input" type="time" data-first-open value="${item.firstOpen}" ${item.open ? '' : 'disabled'}><span>até</span><input class="input" type="time" data-first-close value="${item.firstClose}" ${item.open ? '' : 'disabled'}></div><div class="schedule-period"><input class="input" type="time" data-second-open value="${item.secondOpen}" ${item.open ? '' : 'disabled'}><span>até</span><input class="input" type="time" data-second-close value="${item.secondClose}" ${item.open ? '' : 'disabled'}></div></div>`; }).join('')}</div><p id="business-status" style="margin-top:16px;color:var(--primary);font-weight:700">${scheduleStatus().text}</p></section>`; }
            function renderModernSettings() { app.innerHTML = layout('Configurações', 'Ajuste aparência, perfis e catálogo da sua Central.') + `<div class="panel"><section class="settings-section"><h3>Aparência</h3><p>Escolha como a Central deve aparecer neste navegador.</p><div class="choice-row">${[['light','Tema claro'],['dark','Tema escuro'],['auto','Automático']].map(([id,label]) => `<button class="choice ${state.appearance.theme === id ? 'selected' : ''}" data-theme-choice="${id}">${label}</button>`).join('')}</div></section><section class="settings-section"><h3>Cor principal</h3><p>A cor escolhida se aplica à interface inteira.</p><div class="choice-row">${Object.entries(colors).map(([id,color]) => `<button class="choice ${state.appearance.color === id ? 'selected' : ''}" data-color-choice="${id}"><i class="color-dot" style="background:${color}"></i>${id[0].toUpperCase() + id.slice(1)}</button>`).join('')}</div></section><hr style="border:0;border-top:1px solid var(--line);margin:26px 0"><h3>Modo Pessoal</h3><p>Nome, foto e informações pessoais ficam separados do perfil Business.</p>${profileForm('personal')}<hr style="border:0;border-top:1px solid var(--line);margin:26px 0"><h3>Modo Business</h3><p>Dados da empresa e catálogo são exclusivos desta conta.</p>${profileForm('business')}${scheduleMarkup()}${state.activeProfile === 'business' ? catalogMarkup() : ''}</div>`; bindSettings(); }
            function catalogMarkup() { const products = state.profiles.business.catalog; return `<section class="settings-section" style="margin-top:25px"><div class="view-heading"><div><h3>Catálogo Business</h3><p>Produtos e serviços vinculados somente à empresa.</p></div><button class="button primary" id="add-product">＋ Adicionar</button></div><div class="catalog-grid">${products.length ? products.map(product => `<article class="panel product"><div class="product-image">${product.photo ? `<img src="${product.photo}" alt="" style="width:100%;height:100%;object-fit:cover">` : '▧'}</div><div class="product-body"><h3>${esc(product.name)}</h3><p>${esc(product.description) || 'Sem descrição'}</p><div class="product-footer"><span class="price">${esc(product.price) || 'Preço sob consulta'}</span><span><button class="button secondary" data-edit-product="${product.id}">Editar</button> <button class="button danger" data-delete-product="${product.id}">Excluir</button></span></div></div></article>`).join('') : '<div class="panel empty" style="grid-column:1/-1"><strong>Catálogo vazio</strong><span>Adicione produtos ou serviços para sua conta Business.</span></div>'}</div></section>`; }
            function bindSettings() { document.querySelectorAll('[data-theme-choice]').forEach(button => button.onclick = () => { state.appearance.theme = button.dataset.themeChoice; save(); applyAppearance(); renderModernSettings(); }); document.querySelectorAll('[data-color-choice]').forEach(button => button.onclick = () => { state.appearance.color = button.dataset.colorChoice; save(); applyAppearance(); renderModernSettings(); }); document.querySelectorAll('[data-schedule-open]').forEach(input => input.onchange = () => { const row = input.closest('[data-day]'), item = state.profiles.business.schedule[row.dataset.day]; item.open = input.checked; row.querySelectorAll('input[type=time]').forEach(field => field.disabled = !input.checked); save(); document.getElementById('business-status').textContent = scheduleStatus().text; }); document.querySelectorAll('.schedule-row input[type=time]').forEach(input => input.onchange = () => { const row = input.closest('[data-day]'), item = state.profiles.business.schedule[row.dataset.day]; item.firstOpen = row.querySelector('[data-first-open]').value; item.firstClose = row.querySelector('[data-first-close]').value; item.secondOpen = row.querySelector('[data-second-open]').value; item.secondClose = row.querySelector('[data-second-close]').value; save(); document.getElementById('business-status').textContent = scheduleStatus().text; }); document.querySelectorAll('[data-save-profile]').forEach(button => button.onclick = async () => { const kind = button.dataset.saveProfile, profile = state.profiles[kind]; profile.name = document.getElementById(`${kind}-name`).value; profile.info = document.getElementById(kind === 'business' ? 'business-info' : 'personal-info').value; if (kind === 'business') { profile.address = document.getElementById('business-address').value; profile.type = document.getElementById('business-type').value; profile.description = document.getElementById('business-description').value; } const photo = await fileToDataUrl(document.getElementById(`${kind}-photo`).files[0]); if (photo) profile.photo = photo; save(); profileHeader(); renderModernSettings(); showToast('Perfil salvo'); }); const add = document.getElementById('add-product'); if (add) add.onclick = () => openProductModal(); document.querySelectorAll('[data-edit-product]').forEach(button => button.onclick = () => openProductModal(state.profiles.business.catalog.find(product => product.id === button.dataset.editProduct))); document.querySelectorAll('[data-delete-product]').forEach(button => button.onclick = () => { if (confirm('Excluir este produto do catálogo?')) { state.profiles.business.catalog = state.profiles.business.catalog.filter(product => product.id !== button.dataset.deleteProduct); save(); renderModernSettings(); } }); }
            function openProductModal(existing) { const product = existing || {}; document.getElementById('modal-root').innerHTML = `<div class="modal-backdrop"><div class="modal"><div class="modal-heading"><div><div class="eyebrow">Catálogo Business</div><h2>${existing ? 'Editar produto' : 'Adicionar produto'}</h2></div><button class="close" id="close-modal">×</button></div><form id="product-form"><div class="form-grid"><div class="field full"><label>Nome</label><input class="input" name="name" required value="${esc(product.name)}"></div><div class="field full"><label>Descrição</label><textarea class="textarea" name="description">${esc(product.description)}</textarea></div><div class="field"><label>Preço <span>opcional</span></label><input class="input" name="price" value="${esc(product.price)}"></div><div class="field"><label>Foto <span>opcional</span></label><input class="input" name="photo" type="file" accept="image/*"></div></div><div class="form-actions"><button type="button" class="button secondary" id="cancel-modal">Cancelar</button><button class="button primary">Salvar produto</button></div></form></div></div>`; const close = () => document.getElementById('modal-root').innerHTML = ''; document.getElementById('close-modal').onclick = close; document.getElementById('cancel-modal').onclick = close; document.getElementById('product-form').onsubmit = async event => { event.preventDefault(); const form = new FormData(event.target), data = Object.fromEntries(form); const photo = await fileToDataUrl(event.target.photo.files[0]); const item = existing || { id: crypto.randomUUID() }; Object.assign(item, data); if (photo) item.photo = photo; if (!existing) state.profiles.business.catalog.unshift(item); save(); close(); renderModernSettings(); showToast('Produto salvo'); }; }
            function renderModern() { profileHeader(); if (activePage === 'inicio') renderModernHome(); else if (activePage === 'clientes') renderModernClients(); else if (activePage === 'relatorios') renderReports(); else if (activePage === 'configuracoes') renderModernSettings(); else renderPlaceholder(activePage[0].toUpperCase() + activePage.slice(1)); }
            document.querySelector('[data-page="atendimentos"]')?.remove(); document.querySelectorAll('.menu').forEach(item => item.onclick = () => { activePage = item.dataset.page; searchTerm = ''; renderModern(); }); document.getElementById('profile-select').onchange = event => { state.activeProfile = event.target.value; save(); renderModern(); }; renderModern(); setInterval(() => { if (activePage === 'inicio' && state.activeProfile === 'business') renderModernHome(); }, 60000);
        })();
    </script>
</body>
</html>
